<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Облік студентів — Варіант 11</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f9;
      color: #1e2a3a;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #1a2538;
    }

    .subtitle {
      color: #5a6a80;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    /* ---- Форма додавання ---- */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a2538;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 200px;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #4a5a70;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input[type="text"],
    input[type="number"] {
      border: 1.5px solid #d0d9e6;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.95rem;
      color: #1e2a3a;
      outline: none;
      transition: border-color .15s;
      background: #f8fafc;
    }

    input:focus {
      border-color: #3a7bd5;
      background: #fff;
    }

    button[type="submit"] {
      align-self: flex-end;
      background: #3a7bd5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }

    button[type="submit"]:hover { background: #2e63b0; }
    button[type="submit"]:disabled { background: #8aabda; cursor: not-allowed; }

    /* ---- Повідомлення ---- */
    #message {
      font-size: 0.88rem;
      margin-top: 10px;
      min-height: 20px;
      font-weight: 500;
    }

    #message.success { color: #1a7f4a; }
    #message.error   { color: #c0392b; }

    /* ---- Пошук ---- */
    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-row input {
      flex: 1;
      border: 1.5px solid #d0d9e6;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
      transition: border-color .15s;
    }

    .search-row input:focus { border-color: #3a7bd5; }

    .count-badge {
      background: #e8f0fb;
      color: #3a7bd5;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.83rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ---- Таблиця ---- */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #f0f4f9;
      color: #4a5a70;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 2px solid #dce5f0;
    }

    tbody tr {
      border-bottom: 1px solid #edf1f7;
      transition: background .1s;
    }

    tbody tr:hover { background: #f5f8fd; }

    tbody td {
      padding: 11px 14px;
      font-size: 0.93rem;
      vertical-align: middle;
    }

    /* Середній бал — візуальний індикатор */
    .grade-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grade-bar-bg {
      flex: 1;
      height: 6px;
      background: #e0e8f4;
      border-radius: 4px;
      overflow: hidden;
      min-width: 60px;
    }

    .grade-bar {
      height: 100%;
      border-radius: 4px;
      transition: width .4s ease;
    }

    .grade-val {
      font-weight: 700;
      min-width: 42px;
      text-align: right;
    }

    /* Кольори балів */
    .grade-high   { background: #22c45e; color: #15803d; }
    .grade-mid    { background: #f59e0b; color: #b45309; }
    .grade-low    { background: #ef4444; color: #b91c1c; }

    /* Стан завантаження / порожній стан */
    #results-container {
      position: relative;
      min-height: 80px;
    }

    .state-msg {
      text-align: center;
      color: #8a9bb0;
      font-size: 0.95rem;
      padding: 32px 0;
    }

    .loader {
      display: inline-block;
      width: 22px; height: 22px;
      border: 3px solid #d0d9e6;
      border-top-color: #3a7bd5;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Нова строка — підсвітка після додавання */
    @keyframes rowFlash {
      0%   { background: #d4e8ff; }
      100% { background: transparent; }
    }

    tr.new-row { animation: rowFlash 1.4s ease-out forwards; }
  </style>
</head>
<body>
<div class="container">

  <h1>Облік студентів</h1>
  <p class="subtitle">Варіант 11 — перегляд, пошук за групою, додавання записів через AJAX</p>

  <!-- Форма додавання -->
  <div class="card">
    <h2>Додати студента</h2>
    <form id="add-form" novalidate>
      <div class="form-row">
        <div class="form-group" style="flex: 2 1 260px;">
          <label for="f-name">ПІБ студента</label>
          <input id="f-name" name="name" type="text"
                 placeholder="Іваненко Іван Іванович" required />
        </div>
        <div class="form-group">
          <label for="f-group">Група</label>
          <input id="f-group" name="group_name" type="text"
                 placeholder="КН-32" required />
        </div>
        <div class="form-group" style="flex: 0 1 150px;">
          <label for="f-grade">Середній бал</label>
          <input id="f-grade" name="average_grade" type="number"
                 min="0" max="100" step="0.01"
                 placeholder="0 – 100" required />
        </div>
        <button type="submit" id="submit-btn">Додати</button>
      </div>
      <div id="message"></div>
    </form>
  </div>

  <!-- Пошук -->
  <div class="card">
    <div class="search-row">
      <input id="search" type="text"
             placeholder="Фільтр за групою (наприклад: ІП-31)…"
             autocomplete="off" />
      <span class="count-badge" id="count-badge">0 студентів</span>
    </div>

    <div id="results-container">
      <div class="state-msg"><span class="loader"></span> Завантаження…</div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
